---
kind: Namespace
apiVersion: v1
metadata:
  name: nodejs-dev

---
kind: ConfigMap
apiVersion: v1
metadata:
  name: nodejs-config-map
  namespace: nodejs-dev
data:
  DB_PORT: "53306"
  DB_NAME: recon

---
kind: Secret
apiVersion: v1
metadata: 
  name: nodejs-secret
  namespace: nodejs-dev
type: Opaque
data:
  DB_USER: "root"
  DB_PASSWORD: FNWIEB32844B=

---
kind: Deployment
apiVersion: apps/v1
metadata: 
  name: nodejs-deployment
  namespace: nodejs-dev
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: nodejs-app
        image: node:22
        ports:
        - containerPort: 8888
        env:
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: nodejs-config-map
              key: DB_NAME
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: nodejs-config-map
              key: DB_PORT  
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: nodejs-secret
              key: DB_USER           
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nodejs-secret
              key: DB_PASSWORD

---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: nextjs-deployment
  namespace: nodejs-dev
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: nextjs-app
        image: nextjs-frontend:latest
        ports: 
        - containerPort: 8888
        env:
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: nodejs-config-map
              key: DB_NAME
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: nodejs-config-map
              key: DB_PORT  
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: nodejs-secret
              key: DB_USER           
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nodejs-secret
              key: DB_PASSWORD

---
kind: service
apiVersion: v1
metadata:
  name: nodejs-service
  namespace: nodejs-dev
spec:
  selector:
    app: backend
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 8888

---
kind: Service
apiVersion: v1
metadata:
  name: nextjs-service
  namespace: nodejs-dev
spec:
  selector:
    app: frontend
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 8888
---
kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: nodejs-ingress
  namespace: nodejs-dev
spec:
  rules:
  - host: abc.com
    http:
    paths:
    - path: /
      pathType: Prefix
      backend:
        service:
          name: nodejs-service
          port:
            number: 3000
    - path: /api
      pathType: Prefix
      backend:
        service:
          name: nodejs-service
          port: 
            number: 3000



